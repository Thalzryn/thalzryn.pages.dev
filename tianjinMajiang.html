<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能麻将计分器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #333; padding: 12px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 12px; color: #2c3e50; font-size: 1.3rem; }
    
    .card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .card-title { font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

    /* 玩家实时总分展示 */
    .players-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
    .player-box { background: #f8f9fa; border: 2px solid #bdc3c7; border-radius: 6px; padding: 8px 2px; cursor: pointer; }
    .player-box.is-dealer { border-color: #e67e22; background: #fef5e7; }
    .player-box .pos { font-size: 1rem; font-weight: bold; }
    .player-box .dealer-tag { font-size: 0.65rem; background: #e67e22; color: #fff; padding: 1px 4px; border-radius: 3px; }
    .player-box .score { font-size: 1.15rem; font-weight: bold; margin-top: 4px; color: #27ae60; }
    .player-box .score.negative { color: #e74c3c; }

    /* 单局结算面板 */
    .input-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .input-card { background: #fdfdfd; border: 1px solid #dcdfe6; border-radius: 6px; padding: 6px 4px; text-align: center; }
    .input-card .name { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
    
    /* 分数预览显示 */
    .sub-score { font-size: 0.75rem; color: #7f8c8d; margin-top: 2px; }
    .total-preview { font-size: 1rem; font-weight: bold; margin: 4px 0; color: #2980b9; }

    /* 按钮组 */
    .btn-group { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .btn-action { background: #ecf0f1; border: 1px solid #bdc3c7; padding: 4px 2px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; transition: 0.1s; }
    .btn-action:active { transform: scale(0.96); }
    .btn-action.win { background: #e8f8f5; color: #16a085; border-color: #a3e4d7; font-weight: bold; }
    .btn-action.gang { background: #eaf2f8; color: #2980b9; border-color: #a9cce3; }
    .btn-action.chan { background: #fadbd8; color: #c0392b; border-color: #f5b7b1; }

    .btn-submit { background: #27ae60; color: #fff; width: 100%; padding: 12px; font-size: 1.05rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 8px; }
    .btn-submit:hover { background: #2196f3; }
    .btn-reset-round { background: #95a5a6; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }

    /* 历史表格 */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
    th, td { border: 1px solid #e0e0e0; padding: 6px 2px; }
    th { background: #f2f4f5; }
    .btn-del { background: #e74c3c; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 0.7rem; }
  </style>
</head>
<body>

  <h1>智能麻将计分器</h1>

  <!-- 1. 顶部总分与庄家 -->
  <div class="card">
    <div class="card-title">
      <span>第 <span id="round-number">1</span> 局 (点击方位可手动指定庄家)</span>
      <button onclick="resetAll()" style="font-size: 0.75rem; padding: 2px 6px; cursor: pointer;">重置整局</button>
    </div>
    <div class="players-grid">
      <div class="player-box" id="box-东" onclick="setDealer(0)">
        <div class="pos">东 <span id="dealer-tag-东" class="dealer-tag">庄</span></div>
        <div class="score" id="score-东">0</div>
      </div>
      <div class="player-box" id="box-南" onclick="setDealer(1)">
        <div class="pos">南 <span id="dealer-tag-南" class="dealer-tag" style="display:none;">庄</span></div>
        <div class="score" id="score-南">0</div>
      </div>
      <div class="player-box" id="box-西" onclick="setDealer(2)">
        <div class="pos">西 <span id="dealer-tag-西" class="dealer-tag" style="display:none;">庄</span></div>
        <div class="score" id="score-西">0</div>
      </div>
      <div class="player-box" id="box-北" onclick="setDealer(3)">
        <div class="pos">北 <span id="dealer-tag-北" class="dealer-tag" style="display:none;">庄</span></div>
        <div class="score" id="score-北">0</div>
      </div>
    </div>
  </div>

  <!-- 2. 本局结算面板 -->
  <div class="card">
    <div class="card-title">
      <span>本局积分结算</span>
      <button class="btn-reset-round" onclick="clearCurrentInput()">清空本局输入</button>
    </div>

    <!-- 快捷自动推断：自摸/胡牌提示 -->
    <div style="margin-bottom: 10px; font-size: 0.8rem; background: #f8f9fa; padding: 8px; border-radius: 6px; border: 1px dashed #ccc;">
      <b>💡 分数自动推断说明：</b><br>
      • <b>自摸/庄赢：</b>只要填某人赢得分（如 `+3`），其余三人自动各 `-1`。<br>
      • <b>杠/铲规则：</b>明杠 (+1/人)、暗杠 (+2/人)、<b>铲（点击者 -3，其余三人各 +1）</b>。
    </div>
    
    <div class="input-row">
      <!-- 4家输入面板 -->
      <script>
        const posList = ['东', '南', '西', '北'];
        document.write(posList.map(pos => `
          <div class="input-card">
            <div class="name">${pos}</div>
            <div style="font-size:0.7rem; color:#666;">胡牌输赢分:</div>
            <input type="number" id="hu-${pos}" value="0" oninput="autoInferHu('${pos}')" style="width:100%; text-align:center; padding:4px; font-weight:bold; margin:2px 0;">
            
            <div class="btn-group">
              <button class="btn-action win" onclick="quickZimo('${pos}')">自摸+3</button>
              <button class="btn-action gang" onclick="addGang('${pos}', 1)">明杠(+1/家)</button>
              <button class="btn-action gang" onclick="addGang('${pos}', 2)">暗杠(+2/家)</button>
              <button class="btn-action chan" onclick="addChan('${pos}')">铲(-3,各+1)</button>
            </div>

            <div class="sub-score" id="gang-info-${pos}">杠/铲: 0</div>
            <div class="total-preview" id="total-preview-${pos}">小计: 0</div>
          </div>
        `).join(''));
      </script>
    </div>

    <div style="margin: 10px 0 5px 0; font-size: 0.85rem; text-align: center;">
      <label style="cursor: pointer;">
        <input type="checkbox" id="chk-dealer-win"> 庄家赢 / 连庄（不勾选则提交后庄家自动按东南西北顺延）
      </label>
    </div>

    <button class="btn-submit" onclick="submitRound()">确认本局结算，进入下一局</button>
  </div>

  <!-- 3. 历史记录 -->
  <div class="card">
    <div class="card-title">战绩明细</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>局</th>
            <th>庄</th>
            <th>东</th>
            <th>南</th>
            <th>西</th>
            <th>北</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const positions = ['东', '南', '西', '北'];
    let currentRound = 1;
    let dealerIndex = 0; // 0:东, 1:南, 2:西, 3:北
    let scores = { '东': 0, '南': 0, '西': 0, '北': 0 };
    let gangScores = { '东': 0, '南': 0, '西': 0, '北': 0 };
    let historyList = [];

    function init() {
      updateDealerDisplay();
      updateScoreDisplay();
      updatePreview();
    }

    function setDealer(idx) {
      dealerIndex = idx;
      updateDealerDisplay();
    }

    // 1. 自动推断胡牌分数：若填了某人赢分，其余三人平摊输分；若填了某人输分，赢家平算
    function autoInferHu(changedPos) {
      const val = parseInt(document.getElementById(`hu-${changedPos}`).value) || 0;
      
      if (val > 0) {
        // 该玩家赢钱，假设是另外三家平摊
        const losePerPerson = -Math.round(val / 3);
        positions.forEach(p => {
          if (p !== changedPos) {
            document.getElementById(`hu-${p}`).value = losePerPerson;
          }
        });
      }
      updatePreview();
    }

    // 快捷自摸按钮
    function quickZimo(winner) {
      positions.forEach(p => {
        if (p === winner) {
          document.getElementById(`hu-${p}`).value = 3;
        } else {
          document.getElementById(`hu-${p}`).value = -1;
        }
      });
      updatePreview();
    }

    // 2. 杠分计算：明杠 (+1/家)，暗杠 (+2/家)
    function addGang(player, basePoints) {
      // player 赢 basePoints * 3 分，其余三人各扣 basePoints
      positions.forEach(p => {
        if (p === player) {
          gangScores[p] += basePoints * 3;
        } else {
          gangScores[p] -= basePoints;
        }
      });
      updatePreview();
    }

    // 3. 铲计算：点击者 -3，其余三人各 +1
    function addChan(player) {
      positions.forEach(p => {
        if (p === player) {
          gangScores[p] -= 3; // 铲的人 -3
        } else {
          gangScores[p] += 1; // 其余人各 +1
        }
      });
      updatePreview();
    }

    // 更新界面小计预览
    function updatePreview() {
      positions.forEach(p => {
        const huVal = parseInt(document.getElementById(`hu-${p}`).value) || 0;
        const gVal = gangScores[p];
        const total = huVal + gVal;

        document.getElementById(`gang-info-${p}`).innerText = `杠/铲: ${gVal >= 0 ? '+' + gVal : gVal}`;
        
        const previewEl = document.getElementById(`total-preview-${p}`);
        previewEl.innerText = `小计: ${total >= 0 ? '+' + total : total}`;
        previewEl.style.color = total >= 0 ? '#27ae60' : '#e74c3c';
      });
    }

    function clearCurrentInput() {
      positions.forEach(p => {
        document.getElementById(`hu-${p}`).value = 0;
        gangScores[p] = 0;
      });
      updatePreview();
    }

    function updateDealerDisplay() {
      positions.forEach((pos, idx) => {
        const box = document.getElementById(`box-${pos}`);
        const tag = document.getElementById(`dealer-tag-${pos}`);
        if (idx === dealerIndex) {
          box.classList.add('is-dealer');
          tag.style.display = 'inline-block';
        } else {
          box.classList.remove('is-dealer');
          tag.style.display = 'none';
        }
      });
      document.getElementById('round-number').innerText = currentRound;
    }

    function updateScoreDisplay() {
      positions.forEach(pos => {
        const scoreEl = document.getElementById(`score-${pos}`);
        const val = scores[pos];
        scoreEl.innerText = val > 0 ? `+${val}` : val;
        scoreEl.className = 'score ' + (val < 0 ? 'negative' : '');
      });
    }

    function submitRound() {
      const currentDealer = positions[dealerIndex];
      let roundFinalScores = {};
      
      // 计算最终每家总加减分 = 胡牌分 + 杠铲分
      positions.forEach(pos => {
        const huVal = parseInt(document.getElementById(`hu-${pos}`).value) || 0;
        const gVal = gangScores[pos];
        roundFinalScores[pos] = huVal + gVal;
      });

      // 累加到全局总分
      positions.forEach(pos => {
        scores[pos] += roundFinalScores[pos];
      });

      // 庄家轮换逻辑
      const dealerWin = document.getElementById('chk-dealer-win').checked;
      let prevDealerIndex = dealerIndex;
      if (!dealerWin) {
        dealerIndex = (dealerIndex + 1) % 4;
      }

      // 保存历史
      historyList.push({
        id: Date.now(),
        round: currentRound,
        dealer: currentDealer,
        scores: { ...roundFinalScores },
        prevDealerIndex: prevDealerIndex
      });

      // 切到下一局并清空
      currentRound++;
      clearCurrentInput();
      document.getElementById('chk-dealer-win').checked = false;

      updateDealerDisplay();
      updateScoreDisplay();
      renderHistory();
    }

    function deleteHistory(id) {
      const idx = historyList.findIndex(item => item.id === id);
      if (idx !== -1) {
        const item = historyList[idx];
        positions.forEach(pos => {
          scores[pos] -= item.scores[pos];
        });
        dealerIndex = item.prevDealerIndex;
        currentRound = item.round;
        historyList.splice(idx, 1);
        updateDealerDisplay();
        updateScoreDisplay();
        renderHistory();
      }
    }

    function renderHistory() {
      const tbody = document.getElementById('history-body');
      tbody.innerHTML = '';

      [...historyList].reverse().forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.round}</td>
          <td>${item.dealer}</td>
          <td style="color:${item.scores['东'] >= 0 ? 'green' : 'red'}">${item.scores['东'] > 0 ? '+' : ''}${item.scores['东']}</td>
          <td style="color:${item.scores['南'] >= 0 ? 'green' : 'red'}">${item.scores['南'] > 0 ? '+' : ''}${item.scores['南']}</td>
          <td style="color:${item.scores['西'] >= 0 ? 'green' : 'red'}">${item.scores['西'] > 0 ? '+' : ''}${item.scores['西']}</td>
          <td style="color:${item.scores['北'] >= 0 ? 'green' : 'red'}">${item.scores['北'] > 0 ? '+' : ''}${item.scores['北']}</td>
          <td><button class="btn-del" onclick="deleteHistory(${item.id})">撤销</button></div></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function resetAll() {
      if (confirm('确定要重置所有总分和历史记录吗？')) {
        scores = { '东': 0, '南': 0, '西': 0, '北': 0 };
        historyList = [];
        currentRound = 1;
        dealerIndex = 0;
        clearCurrentInput();
        document.getElementById('chk-dealer-win').checked = false;
        init();
        renderHistory();
      }
    }

    init();
  </script>
</body>
</html>
