                <h1>奧秘卡占卜 三位一体</h1>
                <p class="note-text">
                    “三位一体”是使用3张大奥秘卡的简易占卜法。
                    <br>
                    首先将6张大奥秘卡进行打乱，牌面朝下抽出1张放在自己面前。然后抽出第二张放在第一张的左侧。再抽出第三张放在第一张的右侧比其他两张稍微高一点的位置。
                    <br>
                    这三张奥秘卡，左侧象征过去，中间象征现在，右侧象征未来。此时翻开牌面，正位（即图案上下不颠倒）的牌面象征著着所对应六属性中拥有“星极”神力的十二神，而逆位（即图案上下颠倒）的牌面则象征着所对应六属性中拥有“灵极”神力的十二神。
                    <br>
                    (实际上抽牌是横放的，因为网页放不下只能竖放)
                    <br>
                </p>
                <p class="note-text">注：《艾欧泽亚百科全书》并没有写所有卡牌的意义，大部分都是我自己脑补的。<br></p>
