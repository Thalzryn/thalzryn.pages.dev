<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星巡者Thalzryn</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-48x48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="favicon-192x192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/comments.css">
</head>
<body>

  <nav>
    <a href="index.html">星巡者</a>
  </nav>

  <main>
    <section class="bio">
      <h1><a href="about.html" target="_blank" rel="noopener">留言板</a></h1>
      <p>歡迎留下你的想法！</p>

<section class="comments-section">
    <div class="comments-title">發表留言</div>
    
    <div class="comments-container">
        <form id="comment-form" class="comment-form">
            <div class="form-group">
                <input type="text" id="nickname" placeholder="暱稱" required maxlength="20">
            </div>
            <div class="form-group">
                <textarea id="content" placeholder="撰寫你的留言..." required maxlength="500" rows="4"></textarea>
            </div>

            <!-- Turnstile 深色模式驗證框 -->
            <div class="form-group">
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAEl7dZEyK-3daL0o" data-theme="dark"></div>
            </div>

            <button type="submit" id="submit-btn" class="comment-submit-btn">傳送留言</button>
        </form>

        <hr class="comment-divider">

        <!-- 留言列表 -->
        <div id="comments-list">
            <p class="comment-state-text">載入留言中...</p>
        </div>
    </div>
</section>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="assets/js/comments.js"></script>
