<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自用游戏统计 - 星巡者Thalzryn</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-48x48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="favicon-192x192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/steam-library.css">
</head>
<body>
  <main class="steam-page">
  <nav>
    <a href="index.html">← 星巡者</a>
  </nav>
    <header>
      <h1>Steam游戏统计</h1>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">游戏总数</div>
        <div class="stat-value" id="gameCount">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">总游戏时长</div>
        <div class="stat-value" id="totalHours">—</div>
      </div>
    </section>

    <!-- 搜索与筛选 -->
    <section aria-label="游戏列表">

      <div class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="搜索游戏名称..."
          autocomplete="off"
          aria-label="搜索游戏"
        >

        <select id="filter" aria-label="筛选游戏">
          <option value="all">全部游戏</option>
          <option value="completed">已达成全成就</option>
          <option value="incomplete">未完成成就</option>
        </select>

        <select id="sort" aria-label="排序方式">
          <option value="hours-desc">游戏时长：从高到低</option>
          <option value="hours-asc">游戏时长：从低到高</option>
          <option value="achievement-desc">成就率：从高到低</option>
          <option value="achievement-asc">成就率：从低到高</option>
          <option value="name-asc">游戏名称：A-Z</option>
          <option value="name-desc">游戏名称：Z-A</option>
        </select>
      </div>

      <!-- 游戏表格 -->
      <div class="table-shell">
        <table>
          <thead>
            <tr>
              <th style="width:44%">游戏名称</th>
              <th>
                <button type="button" data-sort="hours">
                  游戏时长 ↕
                </button>
              </th>
              <th>成就进度</th>
            </tr>
          </thead>

          <tbody id="gameTable">
            <tr>
              <td colspan="4" class="status">
                正在加载游戏数据...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="table-footer">
        <div id="resultCount" aria-live="polite">
          正在加载...
        </div>

        <nav class="pagination" aria-label="游戏列表分页">
          <button id="prevPage" type="button" disabled>
            上一页
          </button>

          <span id="pageInfo">1 / 1</span>

          <button id="nextPage" type="button" disabled>
            下一页
          </button>
        </nav>
      </div>

    </section>

    <footer>
      STEAM 游戏库 · 个人档案
    </footer>
  </main>

<script src="assets/js/steam.library.js"></script>
</body>
</html>
